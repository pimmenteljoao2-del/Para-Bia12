<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dois meses de nós</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#bfe0f0; --sky-bot:#fde4d2; --twine:#a07c52; --twine-2:#c9a878;
  --wood:#d9a56b; --wood-line:#a8743c; --paper:#fffdf8; --ink:#4a3a35; --rose:#e0577a;
  --linen:#f6ecdc; --shadow:rgba(60,40,30,.25); --empty:#e8dfd2; --hint:#8a7a70;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-top:#1d2150; --sky-bot:#7a4a6a; --twine:#c9a878; --twine-2:#e6cfa5;
    --paper:#fbf6ec; --ink:#4a3a35; --linen:#efe2cc; --shadow:rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --sky-top:#1d2150; --sky-bot:#7a4a6a; --twine:#c9a878; --twine-2:#e6cfa5;
  --linen:#efe2cc; --shadow:rgba(0,0,0,.45); color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Caveat","Segoe Script","Bradley Hand",cursive;
  background:linear-gradient(180deg,var(--sky-top),var(--sky-bot)) fixed;
  overflow-x:hidden;
}
main{max-width:980px; margin:0 auto; padding:28px 0 40px}
.linha{position:relative; padding:0 4vw; margin:0 0 44px}
.linha::before{
  content:""; position:absolute; left:0; right:0; top:10px; height:4px; border-radius:2px;
  background:repeating-linear-gradient(115deg,var(--twine) 0 6px,var(--twine-2) 6px 10px);
  box-shadow:0 3px 4px var(--shadow);
}
.fotos{display:flex; justify-content:center; gap:clamp(10px,3vw,34px); position:relative}
.foto{
  position:relative; display:block; cursor:pointer; padding-top:6px;
  width:clamp(96px,28vw,200px); transform-origin:50% 0; transform:rotate(var(--r,0deg));
  animation:balanca 1.6s ease-out both; animation-delay:var(--d,0s);
}
.foto:hover,.foto:focus-within{animation:none; transform:rotate(calc(var(--r,0deg) * -1)); transition:transform .5s}
.foto input{position:absolute; opacity:0; width:1px; height:1px}
.foto input:focus-visible ~ .moldura{outline:3px solid var(--rose); outline-offset:3px}
.moldura{
  background:var(--paper); padding:8px 8px 26px; border-radius:3px; box-shadow:0 8px 14px var(--shadow);
}
.area{aspect-ratio:1/1; background:var(--empty); display:grid; place-items:center; overflow:hidden; text-align:center}
.area img{width:100%; height:100%; object-fit:cover; display:none}
.area span{color:var(--hint); font-size:clamp(1rem,3.6vw,1.3rem); line-height:1.1; padding:6px}
.tem-foto .area img{display:block}
.tem-foto .area span{display:none}
.pregador{
  position:absolute; top:-6px; left:50%; width:16px; height:44px; margin-left:-8px; z-index:2;
  background:linear-gradient(90deg,var(--wood) 0 45%,var(--wood-line) 45% 55%,var(--wood) 55%);
  border-radius:4px 4px 3px 3px; box-shadow:1px 2px 3px var(--shadow);
}
.pregador::after{content:""; position:absolute; left:2px; right:2px; top:6px; height:3px; background:var(--wood-line); border-radius:2px}
.mensagem-linha .fotos{justify-content:center}
.pano{
  position:relative; width:min(92%,640px); margin-top:6px; padding:34px 28px 30px; text-align:center;
  background:var(--linen); border-radius:4px 4px 14px 14px; transform:rotate(-1deg); transform-origin:50% 0;
  box-shadow:0 10px 18px var(--shadow);
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(160,124,82,.12) 27px 28px);
}
.pano .pregador{left:14%} .pano .pregador.b{left:86%}
.pano p{margin:0; font-weight:700; font-size:clamp(1.9rem,7vw,3.1rem); line-height:1.12}
.pano .titulo{font-size:clamp(1.7rem,6vw,2.6rem)}
.pano .corpo{margin-top:14px; font-weight:500; font-size:clamp(1.3rem,4.4vw,1.8rem); line-height:1.2}
.pano .amo{display:block; margin-top:14px; color:var(--rose); font-size:clamp(1.6rem,5vw,2.3rem)}
.pano .coracao{display:inline-block; animation:pulsa 1.8s ease-in-out infinite}
.acoes{text-align:center; margin-top:8px}
button{
  font:inherit; font-size:1.25rem; color:var(--ink); background:var(--paper); border:2px solid var(--twine);
  border-radius:999px; padding:6px 20px; cursor:pointer; box-shadow:0 3px 6px var(--shadow);
}
button:focus-visible{outline:3px solid var(--rose); outline-offset:2px}
@keyframes balanca{
  0%{transform:rotate(calc(var(--r,0deg) + 9deg))} 30%{transform:rotate(calc(var(--r,0deg) - 6deg))}
  60%{transform:rotate(calc(var(--r,0deg) + 3deg))} 100%{transform:rotate(var(--r,0deg))}
}
@keyframes pulsa{50%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.foto,.pano .coracao{animation:none}}
</style>
</head>

  <div class="acoes">
    <button type="button" id="varias">Adicionar várias fotos</button>
    <input type="file" id="multi" accept="image/*" multiple hidden>
  </div>
</main>
<script>
(function(){
  var slots = Array.prototype.slice.call(document.querySelectorAll('.foto'));
  function mostrar(slot, file){
    if(!file || !/^image\//.test(file.type)) return;
    var r = new FileReader();
    r.onload = function(){
      slot.querySelector('img').src = r.result;
      slot.classList.add('tem-foto');
    };
    r.readAsDataURL(file);
  }
  slots.forEach(function(slot){
    slot.querySelector('input').addEventListener('change', function(e){ mostrar(slot, e.target.files[0]); });
  });
  var multi = document.getElementById('multi');
  document.getElementById('varias').addEventListener('click', function(){ multi.click(); });
  multi.addEventListener('change', function(e){
    var vazios = slots.filter(function(s){ return !s.classList.contains('tem-foto'); });
    var lista = slots.length ? Array.prototype.slice.call(e.target.files) : [];
    lista.forEach(function(f, i){ if(vazios[i]) mostrar(vazios[i], f); });
    multi.value = '';
  });
})();
</script>
